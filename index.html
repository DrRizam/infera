    <script>
      // Applied before paint to avoid a flash of the wrong theme. Tailwind's
      // darkMode is class-based (not the `media` strategy) so a future manual
      // toggle can override system preference later; for now this just makes
      // the .dark palette that already exists in index.css actually activate.
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () {
          document.documentElement.classList.toggle("dark", mq.matches);
        };
        apply();
        mq.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
